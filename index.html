<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Web Absensi Silat</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Login Pelatih</h2>
            <p>Sistem Absensi Pencak Silat</p>

            <form id="login-form">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required placeholder="Masukkan username">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Masukkan password">
                </div>

                <div id="error-message" class="error-message"></div>

                <button type="submit" class="btn-login">Masuk</button>
            </form>
        </div>
    </div>

    <!-- Menghubungkan script login dengan type="module" -->
    <script type="module" src="login.js"></script>
</body>

</html>
